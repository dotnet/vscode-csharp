name: Branch snap
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-script:
    uses: dotnet/arcade/.github/workflows/inter-branch-merge-base.yml@042024f31f9f89422bc172362a04b5a51ac17df9 # main
    with:
      configuration_file_path: '.config/snap-flow.json'
      script_version: '042024f31f9f89422bc172362a04b5a51ac17df9'

  bump-main-version:
    needs: check-script
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Update version.json
        run: npm run incrementVersion
      - name: Create version update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update main version
          title: '[automated] Update main version'
          branch: merge/update-main-version

  update-release-version:
    needs: check-script
    if: github.ref == 'refs/heads/prerelease'
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: merge/prerelease-to-release
          fetch-depth: 0
      - name: Install NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
      - name: Update version.json for release
        run: npm run updateVersionForStableRelease
      - name: Commit and push version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update version for stable release"
          git push origin merge/prerelease-to-release
