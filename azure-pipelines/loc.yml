trigger:
  branches:
    include:
    - main

pr: none

# localization result might not be ready when PR triggered the pipeline.
# Run this weekly to make sure everything is localized.
schedules:
- cron: '0 12 * * 0'
  displayName: Weekly localization run
  always: true
  branches:
    include:
    - main

parameters:
  - name: publishLocalizationFile
    type: boolean
    default: true

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
# Variable group contains the credential for the localization package source.
- group: OneLocBuildVariables

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: netcore1espool-internal
      image: 1es-windows-2022
      os: windows
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    stages:
    - stage: LocalizationStage
      condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
      jobs:
      - job: Localization
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: LOC
            targetPath: '$(Build.SourcesDirectory)/loc'
            condition: ${{ parameters.publishLocalizationFile }}
            artifactName: loc
          - output: pipelineArtifact
            displayName: l10n
            targetPath: '$(Build.SourcesDirectory)/l10n'
            condition: ${{ parameters.publishLocalizationFile }}
            artifactName: l10n
        steps:
        - template: /azure-pipelines/install-node.yml@self
        - checkout: self
          clean: true
          submodules: true
          fetchTags: false
          fetchDepth: 0
        - pwsh: |
            npm install
          displayName: 'Install tools'
        - pwsh: npm run compile
          displayName: 'Compile'
        - pwsh: npm run l10nDevGenerateLocalizationBundle
          displayName: 'Generate bundle.l10.json'
        - pwsh: npm run l10nDevGenerateXlf
          displayName: 'Generate xlf files from bundle.10n.json'
        - task: AzureCLI@2
          displayName: 'Get ceapex token'
          inputs:
            azureSubscription: 'dnceng-onelocbuild-ceapex'
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              $token = az account get-access-token --query accessToken --resource 499b84ac-1321-427f-aa17-267ca6975798 -o tsv
              Write-Host "##vso[task.setvariable variable=CeapexEntraToken;issecret=true]${token}"
        - task: OneLocBuild@2
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          inputs:
            locProj: loc/LocProject.json
            outDir: '$(Build.SourcesDirectory)/loc'
            isCreatePrSelected: false
            patVariable: $(CeapexEntraToken)
            packageSourceAuth: patAuth
            lclSource: lclFilesfromPackage
            LclPackageId: 'LCL-JUNO-PROD-VSCODECS'
        - pwsh: npm run l10nDevImportXlf
          displayName: 'Import xlf to json.'
        - task: AzureCLI@2
          displayName: 'Get GitHub App installation token'
          inputs:
            azureSubscription: 'dnceng-oneloc-githubapp'
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              & "$(Build.SourcesDirectory)/azure-pipelines/Get-GitHubAppToken.ps1" `
                -KeyVaultName 'EngKeyVault' `
                -KeyName 'oneloc-localization-app-key' `
                -AppClientId 'Iv23lijBU8x3gc9lDOc9' `
                -InstallationOwner 'dotnet' `
                -OutputVariableName 'GitHubAppInstallationToken'
        - pwsh: npm run publishLocalizationContent -- --userName dotnet-bot --email dotnet-bot@dotnetfoundation.org --commitSha $(Build.SourceVersion) --targetRemoteRepo vscode-csharp --baseBranch 'main'
          displayName: 'Create PR in GitHub.'
          env:
            GitHubToken: $(GitHubAppInstallationToken)
